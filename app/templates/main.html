<!doctype html>
<html lang="en" class="h-100">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <link rel="icon" href="{{ url_for('static', filename='img/icon/icon.png') }}">

    <title>{{ session.title }} | {{ titlePage }}</title>

    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/canvabouys/calender-css/main.css" integrity="sha256-n4Ben5p6bWASW8YNQPpplNfKa3A5OMQ0/ipRAYf5rsw=" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- FullCalendar via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js" integrity="sha256-twlJ8c4S3MT/5wF9SMbpH5ml++7XY4HmSkdZdx/scpw=" crossorigin="anonymous"></script>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const AppointmentsData = {{ AppointmentsListJson | default('[]') | safe }};
        
        const events = AppointmentsData.map(appointment => ({
          title: appointment[2] + " " + appointment[3] + " " + appointment[4],
          start: appointment[7],
          allDay: true
        }));

        const calendar = new FullCalendar.Calendar(calendarEl, {
          initialView: 'dayGridMonth',
          headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
          },
          events: events
        });

        calendar.render();
      });
    </script>
  </head>
  
  <body class="d-flex flex-column h-100">
    {% block main %}
    <!-- Calendar Placeholder -->
    <div class="container my-4">
      <div id="calendar"></div>
    </div>
    {% endblock %}

    <!-- FOOTER -->
    <footer class="footer mt-auto py-3 bg-light">
      <div class="container">
        <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top p-1">
          <div class="col-md-4 d-flex align-items-center">
            <a href="/" class="mb-3 me-2 mb-md-0 text-muted text-decoration-none lh-1">
              <img class="bi" height="24" src="{{ url_for('static', filename='img/icon/icon.png') }}" alt="{{ session.title }}" title="{{ session.title }}">
            </a>
            <span class="text-muted">&copy; 2025 OrthoSecure</span>
          </div>
          
          <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
            <li class="ms-3">
              <a class="text-muted" href="https://github.com/0xfarben/ortho-secure.git">
                <i style="font-size: 30px;" class="bi bi-github"></i>
              </a>
            </li>
          </ul>
        </footer>
      </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/jquery-3.2.1.slim.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
